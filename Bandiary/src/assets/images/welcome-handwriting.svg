<svg xmlns="http://www.w3.org/2000/svg" width="368" height="112" viewBox="0 0 368 112" fill="none" role="img" aria-label="Welcome">
  <defs>
    <!-- Independent rounded letterforms keep their spacing on every platform. -->
    <path id="letter-w" d="M22 33L31 77Q32 81 34 77L44 43L54 77Q56 81 57 77L67 33"/>
    <path id="letter-e" d="M89 62H113C113 43 87 43 87 64C87 81 105 83 113 74"/>
    <path id="letter-l" d="M136 31V78"/>
    <path id="letter-c" d="M183 53C168 42 157 52 157 64C157 78 171 84 183 75"/>
    <path id="letter-o" d="M233 64C233 44 206 44 206 64C206 84 233 84 233 64Z"/>
    <path id="letter-m" d="M254 78V51M254 60C254 46 274 46 274 60V78M274 60C274 46 294 46 294 60V78"/>
    <path id="letter-e-last" d="M318 62H342C342 43 316 43 316 64C316 81 334 83 342 74"/>
    <linearGradient id="glass-body" x1="0" y1="28" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".23" stop-color="#c0c8e6" stop-opacity=".7"/>
      <stop offset=".49" stop-color="#7887ae" stop-opacity=".8"/>
      <stop offset=".64" stop-color="#e3eaff" stop-opacity=".58"/>
      <stop offset=".84" stop-color="#afb4dc" stop-opacity=".76"/>
      <stop offset="1" stop-color="#657394" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="glass-edge" x1="0" y1="28" x2="12" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".38" stop-color="#8d99bc" stop-opacity=".7"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#7383ac" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="glass-highlight" x1="0" y1="30" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".95"/>
      <stop offset=".42" stop-color="white" stop-opacity=".05"/>
      <stop offset=".7" stop-color="white" stop-opacity=".65"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="light-band">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".5" stop-color="white" stop-opacity=".85"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glass-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="368" height="112" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#6975a2" flood-opacity=".22"/>
    </filter>
    <mask id="letters-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="368" height="112">
      <g stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <use href="#letter-w"/><use href="#letter-e"/><use href="#letter-l"/>
        <use href="#letter-c"/><use href="#letter-o"/><use href="#letter-m"/><use href="#letter-e-last"/>
      </g>
    </mask>
  </defs>
  <style>
    .letter {
      transform-box: fill-box;
      transform-origin: center;
      animation: glass-appear 1050ms cubic-bezier(.16, 1, .3, 1) var(--delay) both;
    }
    .edge { stroke: url(#glass-edge); stroke-width: 10; }
    .body { stroke: url(#glass-body); stroke-width: 8; }
    .highlight { stroke: url(#glass-highlight); stroke-width: 1.6; transform: translate(-2px, -1px); }
    .light { opacity: 0; animation: glass-light 1300ms cubic-bezier(.4, 0, .2, 1) 1200ms both; }
    @keyframes glass-appear {
      from { opacity: 0; transform: translateY(12px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes glass-light {
      0% { opacity: 0; transform: translateX(-90px); }
      20%, 70% { opacity: .8; }
      100% { opacity: 0; transform: translateX(400px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .letter { animation: none; }
      .light { animation: none; opacity: 0; }
    }
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g class="letter" style="--delay: 180ms"><g filter="url(#glass-shadow)"><use class="edge" href="#letter-w"/><use class="body" href="#letter-w"/></g><use class="highlight" href="#letter-w"/></g>
    <g class="letter" style="--delay: 260ms"><g filter="url(#glass-shadow)"><use class="edge" href="#letter-e"/><use class="body" href="#letter-e"/></g><use class="highlight" href="#letter-e"/></g>
    <g class="letter" style="--delay: 340ms"><g filter="url(#glass-shadow)"><use class="edge" href="#letter-l"/><use class="body" href="#letter-l"/></g><use class="highlight" href="#letter-l"/></g>
    <g class="letter" style="--delay: 420ms"><g filter="url(#glass-shadow)"><use class="edge" href="#letter-c"/><use class="body" href="#letter-c"/></g><use class="highlight" href="#letter-c"/></g>
    <g class="letter" style="--delay: 500ms"><g filter="url(#glass-shadow)"><use class="edge" href="#letter-o"/><use class="body" href="#letter-o"/></g><use class="highlight" href="#letter-o"/></g>
    <g class="letter" style="--delay: 580ms"><g filter="url(#glass-shadow)"><use class="edge" href="#letter-m"/><use class="body" href="#letter-m"/></g><use class="highlight" href="#letter-m"/></g>
    <g class="letter" style="--delay: 660ms"><g filter="url(#glass-shadow)"><use class="edge" href="#letter-e-last"/><use class="body" href="#letter-e-last"/></g><use class="highlight" href="#letter-e-last"/></g>
  </g>
  <g mask="url(#letters-mask)"><path class="light" d="M0 12H48L80 100H32Z" fill="url(#light-band)"/></g>
</svg>
