<svg
  xmlns="http://www.w3.org/2000/svg"
  width="340"
  height="92"
  viewBox="0 0 340 92"
  fill="none"
  role="img"
  aria-label="Welcome"
>
  <style>
    .handwriting-stroke {
      stroke: #19181f;
      stroke-width: 3.15;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
      animation: draw-stroke var(--duration, 260ms)
        cubic-bezier(0.35, 0, 0.25, 1) var(--delay, 0ms) both;
    }

    .fine-stroke {
      stroke-width: 2;
    }

    .pressure-stroke {
      stroke-width: 4.1;
      --stroke-opacity: 0.72;
    }

    @keyframes draw-stroke {
      0% {
        opacity: 0;
        stroke-dashoffset: 1;
      }

      2% {
        opacity: var(--stroke-opacity, 1);
      }

      100% {
        opacity: var(--stroke-opacity, 1);
        stroke-dashoffset: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .handwriting-stroke {
        animation: none;
        opacity: var(--stroke-opacity, 1);
        stroke-dashoffset: 0;
      }
    }
  </style>

  <!-- W -->
  <path
    class="handwriting-stroke"
    pathLength="1"
    style="--delay: 760ms; --duration: 620ms"
    d="M13 29C17 20 23 17 27 21C32 26 26 50 27 64C28 73 33 76 38 68C45 57 49 40 52 28C50 42 47 61 51 69C55 77 61 75 67 67C74 57 78 42 80 30C78 44 75 57 77 65"
  />
  <path
